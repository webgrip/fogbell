apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fogbell.fullname" . }}
  labels:
    {{- include "fogbell.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "fogbell.config" . | nindent 4 }}
  {{- with .Values.roster }}
  roster.yaml: |
    {{- toYaml . | nindent 4 }}
  {{- end }}
