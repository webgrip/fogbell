name: On Source Change

on:
  push:
    branches: ['**']
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'testdata/**'
      - 'examples/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'mise.toml'
      - 'mise.lock'
      - '.golangci.yml'
      - '.releaserc.cjs'
      - '.forgejo/workflows/on_source_change.yml'
  pull_request:

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (gofmt, vet, golangci-lint, race tests, chart, configuration, REUSE, image build)
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: https://github.com/jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          cache: false
          github_token: ''
      - run: mise run verify
      - run: mise run reuse
      - name: The image builds
        run: |
          set -euo pipefail
          docker build --file Dockerfile --target app \
            --build-arg REGISTRY_DOCKERHUB=harbor.webgrip.dev/dockerhub \
            --output=type=cacheonly .

  dco:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/dco-check.sh "$BASE" "$HEAD"

  release:
    name: Semantic Release
    needs: [verify]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release:2.3.1@sha256:a39fd2d6a0b29a947903def7ba88b20d17e73d22040ed01fc7b2e2bb6973068a
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release@v4.2.0
        with:
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
          install-dependencies: 'false'
