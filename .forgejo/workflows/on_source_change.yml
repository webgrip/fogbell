name: On Source Change

on:
  push:
    branches: ['**']
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'testdata/**'
      - 'examples/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'mise.toml'
      - '.golangci.yml'
      - '.releaserc.cjs'
      - '.forgejo/workflows/on_source_change.yml'
  pull_request:

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: webgrip/workflows/.forgejo/workflows/go-application-tests.yml@cc494a9384d6e5edc88031b8d32f6de4de908139 # v3.3.0
    with:
      go-version: '1.27.3'

  verify:
    name: Verify (gofmt, vet, golangci-lint, race tests, chart, configuration, REUSE, image build)
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: https://github.com/jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          cache: false
          github_token: ''
      - run: mise run verify
      - run: mise run reuse
      - name: The image builds
        run: |
          set -euo pipefail
          docker build --file Dockerfile --target app \
            --build-arg REGISTRY_DOCKERHUB=harbor.webgrip.dev/dockerhub \
            --output=type=cacheonly .

  dco:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/dco-check.sh "$BASE" "$HEAD"

  release:
    name: Semantic Release
    needs: [tests, verify]
    if: always() && needs.verify.result == 'success' && needs.tests.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release:2.1.0@sha256:9fa6ddc14d1a126fe14a7a63b88bf49cb2ee9053b88b4939db60d7761d492d2d
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release@v3.3.0
        with:
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
          install-dependencies: 'false'
