version: 2
project_name: fogbell
before:
  hooks:
    - go mod download
builds:
  - id: fogbell
    main: ./cmd/fogbell
    binary: fogbell
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  - id: fogbell
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
kos:
  - id: fogbell
    build: fogbell
    main: ./cmd/fogbell
    base_image: cgr.dev/chainguard/static:latest
    repositories:
      - ghcr.io/webgrip/fogbell
    platforms: [linux/amd64, linux/arm64]
    tags:
      - "{{ .Version }}"
    bare: true
    preserve_import_paths: false
    sbom: spdx
    ldflags:
      - -s -w -X main.version={{ .Version }}
    flags:
      - -trimpath
    labels:
      org.opencontainers.image.source: https://github.com/webgrip/fogbell
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum
    output: true
docker_signs:
  - cmd: cosign
    artifacts: manifests
    args: ["sign", "${artifact}", "--yes"]
changelog:
  disable: true
release:
  github:
    owner: webgrip
    name: fogbell
  mode: keep-existing
  prerelease: auto
